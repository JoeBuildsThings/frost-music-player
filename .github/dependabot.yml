# At most one PR per ecosystem per week, so the repo never fills up with branches.
# Major versions (for example Android Gradle Plugin 9, Haze 2) are ignored here: they need a
# deliberate migration and a device test, so upgrade them by hand.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    groups:
      gradle-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: [ "*" ]
    open-pull-requests-limit: 1
