name: Build Frost APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-frost-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: Frost-Music-Player-v0.6.${{ github.run_number }}.apk

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: frost-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build release APK
        id: release
        continue-on-error: true
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename release APK
        if: steps.release.outcome == 'success'
        run: cp app/build/outputs/apk/release/app-release.apk "./${APK_NAME}"

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: frost-release
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' && steps.release.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.${{ github.run_number }}
          name: Frost Music Player v0.6.${{ github.run_number }}
          body: "Standalone Android APK (R8-minified, Android 6.0+ / API 23+). Download the APK below and install it on your device."
          files: ${{ env.APK_NAME }}
