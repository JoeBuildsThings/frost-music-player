name: Build Frost APK

# main pushes, PRs and manual runs: wrapper check, lint, unit tests, debug APK.
# Pushing a v* tag (git tag v0.7.0 && git push origin v0.7.0) also builds the signed
# release APK and publishes it to GitHub Releases.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-frost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Lint, unit tests and debug build
        # --continue: one run reports lint, test and compile problems together.
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --continue --stacktrace

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frost-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APK_NAME: Frost-Music-Player-${{ github.ref_name }}.apk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Refusing to publish an APK users cannot update to."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/frost-release.jks

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_FILE: frost-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease -Pfrost.requireSigning=true --stacktrace

      - name: Remove release keystore
        if: always()
        run: rm -f app/frost-release.jks

      - name: Show signing certificate
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "./${APK_NAME}"
          cp app/build/outputs/bundle/release/app-release.aab "./${APK_NAME%.apk}.aab"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Frost Music Player ${{ github.ref_name }}
          generate_release_notes: true
          body: "Standalone Android APK (R8 minified, Android 6.0+ / API 23+). Download the APK below and install it on your device."
          files: |
            ${{ env.APK_NAME }}
            Frost-Music-Player-${{ github.ref_name }}.aab
