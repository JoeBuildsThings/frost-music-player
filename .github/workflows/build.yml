name: Build Frost APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-frost-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_NAME: Frost-Music-Player-v0.6.${{ github.run_number }}.apk

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/frost-release.jks

      - name: Build debug APK (PR checks)
        if: github.event_name == 'pull_request'
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_FILE: frost-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Clean up release keystore
        if: always()
        run: rm -f app/frost-release.jks

      - name: Rename release APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk "./${APK_NAME}"

      - name: Upload release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frost-release
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.${{ github.run_number }}
          name: Frost Music Player v0.6.${{ github.run_number }}
          body: "Standalone Android APK (R8-minified, Android 6.0+ / API 23+). Download the APK below and install it on your device."
          files: ${{ env.APK_NAME }}
